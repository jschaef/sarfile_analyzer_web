# /etc/nginx/conf.d/sarfile-analyzer-web.conf (root): the web frontend on
# :8444 next to the Streamlit vhost on :443, same certificate.
server {
    listen              8444 ssl;
    server_name         dus-lab-sar.lab.dus.suse.com;
    ssl_certificate     /etc/nginx/ssl/dus-lab-sar.lab.dus.suse.com.crt.pem;
    ssl_certificate_key /etc/nginx/ssl/dus-lab-sar.lab.dus.suse.com.key.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains;";
    # Uploads go straight to sar-web-api instead of through the Next.js route
    # app/api/upload: Node.js cuts a request whose transfer takes longer than
    # 5 minutes (http.Server requestTimeout) and the route's fetch waits at
    # most 5 minutes for the parsed result. Same as the route: the session
    # cookie becomes the bearer token (no cookie: sar-web-api answers 401).
    location = /api/upload {
            client_max_body_size 2048M;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:8300/api/v2/files;
            proxy_http_version 1.1;
            proxy_set_header Authorization "Bearer $cookie_sar_session";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # parsing a big sar file: up to an hour without a byte back
            proxy_read_timeout 3600;
    }
    location / {
            # large sar files; streamed to sar-web-api instead of buffered
            client_max_body_size 2048M;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            # $http_host keeps the port: login and signup compare it with
            # the browser's Origin header (https://…:8444) and refuse
            # cross-site posts with 403
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # parsing a big upload takes a while
            proxy_read_timeout 600;
    }
}
